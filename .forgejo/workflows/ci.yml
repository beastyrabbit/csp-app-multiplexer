name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  windows:
    # The WPF application and all supporting projects are validated together on
    # the dedicated Windows host runner.
    runs-on: windows
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Set up .NET 8
        uses: https://data.forgejo.org/actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CspAppMultiplexer.sln

      - name: Verify shared suite files
        run: ./tools/suite-sync.ps1 -Mode Check

      - name: Verify formatting
        run: dotnet format CspAppMultiplexer.sln --verify-no-changes --no-restore

      - name: Build the whole solution
        run: dotnet build CspAppMultiplexer.sln -c Release --no-restore

      - name: Test
        run: dotnet test CspAppMultiplexer.sln -c Release --no-build
